# PostgreSQL only — for local development when running backend on host
# Usage: docker compose -f docker-compose.postgres.yml up -d
# Then set in server/.env:
#   DATABASE_URL=postgresql://zing:zing123@127.0.0.1:5432/zing
#   DB_TYPE=postgresql
# If you see "role zing does not exist", run make postgres-reset-colima (or postgres-reset) then restart the backend.

services:
  postgres:
    image: postgres:16-alpine
    container_name: zing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zing}
      POSTGRES_USER: ${POSTGRES_USER:-zing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zing123}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zing} -d ${POSTGRES_DB:-zing}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data_local:
    driver: local
